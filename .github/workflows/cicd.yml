name: CI/CD Docker images

on:
  push:
    branches: [CICDNew]
  pull_request:
    branches: [CICDNew]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: image
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: KyrgyzTestBackEnd
          file: KyrgyzTestBackEnd/KyrgyzTest.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/kyrgyztest-api:latest
            ghcr.io/${{ steps.image.outputs.owner }}/kyrgyztest-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: KyrgyzTestFrontend
          file: KyrgyzTestFrontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/kyrgyztest-frontend:latest
            ghcr.io/${{ steps.image.outputs.owner }}/kyrgyztest-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
